manifestVersion: 1
id: leroys-sol-diagnostics
storage:
  dataRoot: data
category: finance
name: Sol Diagnostics
version: "2026.11.19.2"
tagline: Analyze solar farm performance and track production losses
icon: https://raw.githubusercontent.com/LeroyZanzibar/sol-diagnostics/v2026.11.19.2/public/favicon.svg
description: >-
  Diagnose solar farm performance using your own locally stored data. Configure
  sites, arrays, inverters, and transformers; import performance CSVs; review
  detected issues and recurring losses; and track maintenance events.


  Sign in as admin using the app password shown by Umbrel. Your existing Umbrel
  login also protects access to the app. The first installation starts empty;
  hosted data and any separate Docker installation are not migrated automatically.


  Site configuration, uploads, analyses, reviews, and preferences are stored on
  your Umbrel. No Cloudflare or ChatGPT account is required. Maps and postal-code
  lookups use external services. Closing the browser can pause an unfinished
  analysis until a later request resumes it.
releaseNotes: >-
  Exclude individual VCOM fields from new imports while retaining existing
  readings. Destination suggestions now reuse the CSV equipment matcher with
  confidence levels, preserving saved and manual choices. Connection testing
  shows immediate progress and clear status through saved-state verification.
  Saved API key, username, and password fields display safe fixed dots without
  exposing or resubmitting credentials.


  Explicit preview/Apply, overlap approval, CSV imports, saved analyses, and
  retained history remain unchanged. No schema migration, scheduled import, or
  automatic analysis is introduced. Back up the complete app storage before
  updating, including all SQLite databases, state/object files, and the private
  VCOM master key. Live VCOM credentials and imports are not exercised by this
  update.
