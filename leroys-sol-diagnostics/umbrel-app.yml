manifestVersion: 1
id: leroys-sol-diagnostics
storage:
  dataRoot: data
category: finance
name: Sol Diagnostics
version: "2026.11.21.2"
tagline: Analyze solar farm performance and track production losses
icon: https://raw.githubusercontent.com/LeroyZanzibar/sol-diagnostics/v2026.11.21.2/public/favicon.svg
description: >-
  Diagnose solar farm performance using your own locally stored data. Configure
  sites, arrays, inverters, and transformers; import performance CSVs; identify
  site and inverter outages, quantify lost production, review telemetry gaps,
  and track maintenance events.


  Sign in as admin using the app password shown by Umbrel. Your existing Umbrel
  login also protects access to the app. The first installation starts empty;
  hosted data and any separate Docker installation are not migrated automatically.


  Site configuration, uploads, analyses, reviews, and preferences are stored on
  your Umbrel. No Cloudflare or ChatGPT account is required. Maps and postal-code
  lookups use external services. Closing the browser can pause an unfinished
  analysis until a later request resumes it.
releaseNotes: >-
  Add optional Unpaid energy to monthly utility inputs. Production totals include
  every present on-peak, off-peak, and unpaid value; unpaid-only months work and
  all-blank months remain blank. Preserve exact entered values through saves.


  Add twelve read-only calculated metrics to Performance data, Projections,
  Monthly comparison: budgeted and actual specific yields, their ratio, budgeted
  and actual performance ratios, their ratio, insolation, production versus
  projection and Expected Production, revenue ratio, IAPR, and IAR. Show specific
  yields to two decimals and percentages to the nearest whole percentage point,
  without rounding the underlying values. Unpaid energy does not create revenue.


  This update adds a nullable unpaid-energy storage column without backfilling
  old months. Preserve existing actuals, source data, settings, analyses, and
  review history. No automatic imports, review resets, or analysis runs. Back up
  complete app storage, including SQLite databases, objects, and the private
  VCOM master key, before updating.
