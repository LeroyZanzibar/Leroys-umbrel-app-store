manifestVersion: 1
id: leroys-sol-diagnostics
storage:
  dataRoot: data
category: finance
name: Sol Diagnostics
version: "2026.11.25.1"
tagline: Analyze solar farm performance and track production losses
icon: https://raw.githubusercontent.com/LeroyZanzibar/sol-diagnostics/v2026.11.25.1/public/favicon.svg
description: >-
  Diagnose solar farm performance using your own locally stored data. Configure
  sites, arrays, inverters, and transformers; import performance CSVs; identify
  site and inverter outages, quantify lost production, review telemetry gaps,
  and track maintenance events.


  Sign in as admin using the app password shown by Umbrel. Your existing Umbrel
  login also protects access to the app. The first installation starts empty;
  hosted data and any separate Docker installation are not migrated automatically.


  Site configuration, uploads, analyses, reviews, and preferences are stored on
  your Umbrel. No Cloudflare or ChatGPT account is required. Maps and postal-code
  lookups use external services. Closing the browser can pause an unfinished
  analysis until a later request resumes it.
releaseNotes: >-
  Show only selected metrics in compact chart hover popups while retaining
  detailed pinned, keyboard and table source information. Add monthly Confirmed
  estimated loss from the current published analysis, refreshed as reviews change
  without double counting or replacing missing values with zero.


  Use authenticated physical POA sensor evidence for monthly Actual Insolation
  and dependent metrics, without satellite or GHI fallback. Historical gaps
  remain unavailable when measured sensor evidence cannot be established.
  Simplify Findings and align its compact reporting-period controls while
  preserving review actions, date validation and historical protections.


  No schema migration or dependency changes. Derived reporting caches refresh;
  canonical measurements, saved analyses, reviews, monthly inputs and chart views
  are preserved. No automatic imports, backfill or analysis runs. Back up complete
  app data, including SQLite databases, objects and the private VCOM master key,
  before updating.
