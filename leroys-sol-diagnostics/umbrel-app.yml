manifestVersion: 1
id: leroys-sol-diagnostics
storage:
  dataRoot: data
category: finance
name: Sol Diagnostics
version: "2026.11.21.1"
tagline: Analyze solar farm performance and track production losses
icon: https://raw.githubusercontent.com/LeroyZanzibar/sol-diagnostics/v2026.11.21.1/public/favicon.svg
description: >-
  Diagnose solar farm performance using your own locally stored data. Configure
  sites, arrays, inverters, and transformers; import performance CSVs; identify
  site and inverter outages, quantify lost production, review telemetry gaps,
  and track maintenance events.


  Sign in as admin using the app password shown by Umbrel. Your existing Umbrel
  login also protects access to the app. The first installation starts empty;
  hosted data and any separate Docker installation are not migrated automatically.


  Site configuration, uploads, analyses, reviews, and preferences are stored on
  your Umbrel. No Cloudflare or ChatGPT account is required. Maps and postal-code
  lookups use external services. Closing the browser can pause an unfinished
  analysis until a later request resumes it.
releaseNotes: >-
  Add saved monthly utility production, revenue, energy use, and invoice cost
  with explicit Edit, Save, and Cancel. Keep entered precision and round only
  the display; a single present production category still supplies the total.


  Set twelve calendar-month projection baselines, operations start, and annual
  degradation, with impact preview and a continuous 300-month schedule. Prorate
  the first month and apply anniversary-weighted production/revenue degradation;
  insolation does not degrade and an unspecified rate remains blank.


  Compare monthly Expected Production and Actual insolation with saved utility
  actuals and projections. Refresh comparisons after committed imports and
  corrections without rerunning outage analysis or replacing manual values.
  Preserve source data, settings, analyses, and review history. This update adds
  monthly storage tables but does not import data, reset reviews, or start an
  analysis. Back up complete app storage, including SQLite databases, objects,
  and the private VCOM master key, before updating.
