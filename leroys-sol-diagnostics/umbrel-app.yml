repo: https://github.com/LeroyZanzibar/sol-diagnostics
support: https://github.com/LeroyZanzibar/sol-diagnostics/issues
port: 3080
gallery: []
path: ""
defaultUsername: admin
defaultPassword: ""
deterministicPassword: true
submitter: LeroyZanzibar
