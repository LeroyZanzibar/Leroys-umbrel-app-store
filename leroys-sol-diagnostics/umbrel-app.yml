manifestVersion: 1
id: leroys-sol-diagnostics
storage:
  dataRoot: data
category: finance
name: Sol Diagnostics
version: "2026.11.26.1"
tagline: Analyze solar farm performance and track production losses
icon: https://raw.githubusercontent.com/LeroyZanzibar/sol-diagnostics/v2026.11.26.1/public/favicon.svg
description: >-
  Diagnose solar farm performance using your own locally stored data. Configure
  sites, arrays, inverters, and transformers; import performance CSVs; identify
  site and inverter outages, quantify lost production, review telemetry gaps,
  and track maintenance events.


  Sign in as admin using the app password shown by Umbrel. Your existing Umbrel
  login also protects access to the app. The first installation starts empty;
  hosted data and any separate Docker installation are not migrated automatically.


  Site configuration, uploads, analyses, reviews, and preferences are stored on
  your Umbrel. No Cloudflare or ChatGPT account is required. Maps and postal-code
  lookups use external services. Closing the browser can pause an unfinished
  analysis until a later request resumes it.
releaseNotes: >-
  Add Confirmed and Unconfirmed estimated loss to monthly Charts, including
  saved views and prior-year comparisons. Monthly comparison adds read-only
  Unconfirmed loss for effective Unreviewed or Needs review findings from the
  current published analysis, excluding effective Confirmed/Dismissed and
  historical results. Preserve exact values, site-local months and unknown/zero
  distinctions; Charts retains mount/site/Retry-only refresh behavior.


  Add persistent derived monthly Unconfirmed snapshots without rewriting
  utility inputs, canonical telemetry, saved analyses or reviews. No automatic
  downloads, imports or analysis runs. Back up complete app data, including
  databases, objects and the private VCOM master key, before updating.
