manifestVersion: 1
id: leroys-sol-diagnostics
storage:
  dataRoot: data
category: finance
name: Sol Diagnostics
version: "2026.11.19.1"
tagline: Analyze solar farm performance and track production losses
icon: https://raw.githubusercontent.com/LeroyZanzibar/sol-diagnostics/v2026.11.19.1/public/favicon.svg
description: >-
  Diagnose solar farm performance using your own locally stored data. Configure
  sites, arrays, inverters, and transformers; import performance CSVs; review
  detected issues and recurring losses; and track maintenance events.


  Sign in as admin using the app password shown by Umbrel. Your existing Umbrel
  login also protects access to the app. The first installation starts empty;
  hosted data and any separate Docker installation are not migrated automatically.


  Site configuration, uploads, analyses, reviews, and preferences are stored on
  your Umbrel. No Cloudflare or ChatGPT account is required. Maps and postal-code
  lookups use external services. Closing the browser can pause an unfinished
  analysis until a later request resumes it.
releaseNotes: >-
  Add manual VCOM imports alongside CSV uploads in the Data, API setup, Field
  mapping, and Activity workspace. Save encrypted server-side credentials and
  explicit equipment mappings, select dates, download, review the preview, and
  explicitly Apply. Submitted downloads continue without an open browser and
  recover after restart, respecting provider quota waits. A status-write failure
  after Apply no longer blocks the next download or duplicates imported readings.
  Export the complete applied dataset as a revision-pinned CSV. Existing readings,
  blank/omitted corrections, saved analyses, and review history retain their
  preservation rules. No scheduled imports or automatic analysis are enabled.


  Back up the complete app storage before updating, including shared/per-site
  SQLite databases, their state files, object files, and the private VCOM master
  key after it is created. The new schema migration is additive. Do not delete or
  regenerate the private key when moving data. Live VCOM access requires your
  provider credentials; no live provider import is performed by this update.
